                        $ref: "#/components/schemas/SubmissionDetail"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/ValidationError"

  /admin/submissions/{id}/status:
    put:
      tags: [Admin]
      summary: Update submission status
      description: Requires admin role.
      operationId: adminUpdateSubmissionStatus
      security:
        - cookieAuth: []
          csrfToken: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdminUpdateSubmissionStatusBody"
      responses:
        "200":
          description: Submission status updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/ValidationError"

  /admin/notifications:
    get:
      tags: [Admin]
      summary: List all broadcast notifications
      description: Requires admin role.
      operationId: adminListBroadcasts
      security:
        - cookieAuth: []
      responses:
        "200":
          description: List of broadcast notifications
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /admin/notifications/broadcast:
    post:
      tags: [Admin]
      summary: Send a broadcast notification
      description: Requires admin role.
      operationId: adminBroadcastNotification
      security:
        - cookieAuth: []
          csrfToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdminBroadcastNotificationBody"
      responses:
        "201":
          description: Broadcast notification sent
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "422":
          $ref: "#/components/responses/ValidationError"

  /admin/users:
    get:
      tags: [Admin]
      summary: List users (paginated, with optional role and search filters)
      description: Requires admin role.
      operationId: adminListUsers
      security:
        - cookieAuth: []
      parameters:
        - name: page
          in: query
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
        - name: role
          in: query
          schema:
            type: string
            enum: [viewer, submitter, editor, manager, admin, super_admin]
        - name: search
          in: query
          description: Case-insensitive substring match against email and display name.
          schema:
            type: string
            minLength: 1
            maxLength: 200
      responses:
        "200":
          description: Paginated list of users
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/PaginatedResponse"
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: "#/components/schemas/AdminUser"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "422":
          $ref: "#/components/responses/ValidationError"

  /admin/users/{id}:
    delete:
      tags: [Admin]
      summary: Soft-delete a user
      description: >
        Requires admin role. Sets is_deleted = true AND is_active = false in a
        single statement, so the row is filtered from every list/read query and
        cannot reauthenticate via SSO. Self-deletion is blocked with 400.
      operationId: adminDeleteUser
      security:
        - cookieAuth: []
          csrfToken: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "204":
          description: User soft-deleted
        "400":
          description: Self-delete attempt
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/ValidationError"

  /admin/users/{id}/role:
    put:
      tags: [Admin]
      summary: Change a user's role
      description: >
        Requires admin role. Self-role-change is blocked with 400 (foot-gun
        guard — the actor would lose admin access mid-session). Writes an
        audit_log entry with before/after role.
      operationId: adminUpdateUserRole
      security:
        - cookieAuth: []
          csrfToken: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateUserRoleInput"
      responses:
        "200":
          description: User role updated
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessResponse"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/AdminUser"
        "400":
          description: Self-role-change attempt or invalid role
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/ValidationError"

  /admin/users/{id}/status:
    put:
      tags: [Admin]
      summary: Toggle a user's is_active status
      description: >
        Requires admin role. Self-toggle is blocked with 400 — an admin
        disabling themselves would lose access mid-session. Writes an
        audit_log entry with before/after status.
      operationId: adminUpdateUserStatus
      security:
        - cookieAuth: []
          csrfToken: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateUserStatusInput"
      responses:
        "200":
          description: User status updated
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessResponse"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/AdminUser"
        "400":
          description: Self-toggle attempt
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/ValidationError"

  # ═══════════════════════════════════════════════════════════════
  # Landing
  # ═══════════════════════════════════════════════════════════════
  /landing:
    get:
      tags: [Landing]
      summary: Get aggregated landing page data
      operationId: getLandingPageData
      security: []
      responses:
        "200":
          description: Landing page data (stats, featured resources, services, etc.)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"

  # ═══════════════════════════════════════════════════════════════
  # Contact
  # ═══════════════════════════════════════════════════════════════
  /contact:
    post:
      tags: [Contact]
      summary: Submit a public contact inquiry
      description: >
        Public — anyone can submit a contact inquiry. No auth required. CSRF
        protection is applied at the `/api` mount, and the global API rate
        limiter caps abuse. The request IP and user-agent are recorded on
        the server for audit correlation but are not echoed back.
      operationId: submitContact
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SubmitContactBody"
      responses:
        "201":
          description: Inquiry recorded
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessResponse"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/ContactInquirySubmission"
        "422":
          $ref: "#/components/responses/ValidationError"
        "429":
          $ref: "#/components/responses/TooManyRequests"

  # ═══════════════════════════════════════════════════════════════
  # Blog (public)
  # ═══════════════════════════════════════════════════════════════
  /blog:
    get:
      tags: [Blog]
      summary: List published blog posts (paginated)
      description: Public — returns only posts where is_published = true AND published_at <= NOW(). Drafts are not visible.
      operationId: listBlogPosts
      security: []
      parameters:
        - name: page
          in: query
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 50
            default: 12
        - name: tag
          in: query
          description: Filter to posts whose tags array contains this tag.
          schema:
            type: string
            minLength: 1
            maxLength: 60
      responses:
        "200":
          description: Paginated list of published blog posts
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/PaginatedResponse"
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: "#/components/schemas/BlogPost"
        "422":
          $ref: "#/components/responses/ValidationError"

  /blog/{slug}:
    get:
      tags: [Blog]
      summary: Get a single published blog post by slug
      description: >
        Public — returns the post only if is_published = true AND
        published_at <= NOW(). Drafts and unpublished posts return 404 so
        the public API never reveals the existence of unpublished URLs.
      operationId: getBlogPost
      security: []
      parameters:
        - name: slug
          in: path
          required: true
          schema:
            type: string
            pattern: "^[a-z0-9]+(?:-[a-z0-9]+)*$"
            maxLength: 200
      responses:
        "200":
          description: Blog post
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessResponse"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/BlogPost"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/ValidationError"
