<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <!-- crossorigin=use-credentials so the manifest fetch sends the SSO cookie
         when the app is deployed behind an auth gateway (otherwise the gateway
         returns its login HTML and the browser fails with a manifest syntax
         error). Same-origin fetches are unaffected. -->
    <link rel="manifest" href="/manifest.webmanifest" crossorigin="use-credentials" />
    <link rel="apple-touch-icon" href="/apple-touch-icon-180x180.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#4f46e5" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <!--
      Content-Security-Policy MUST be set via HTTP response headers on the
      production web server / CDN — not via a <meta> tag. Reasons:
        - frame-ancestors cannot be set via meta tag
        - nonce-based script-src requires server-side generation
        - meta-tag CSP conflicts with build tool / plugin inline scripts

      Recommended production headers:
        Content-Security-Policy: default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: https://*.tile.openstreetmap.org; connect-src 'self'; worker-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self';
        X-Content-Type-Options: nosniff
        X-Frame-Options: DENY
        Strict-Transport-Security: max-age=31536000; includeSubDomains
        Referrer-Policy: strict-origin-when-cross-origin
        Permissions-Policy: camera=(), microphone=(), geolocation=(), payment=()
    -->
    <title>App Template</title>

    <!--
      Base SEO + social meta. Per-page values are overridden at runtime by the
      useSeoMeta() composable (see src/composables/useSeoMeta.ts), which sits
      on top of the router so meta description / og:title / og:url / canonical
      track the active route without a heavy framework (vueuse/head etc.).
    -->
    <meta name="description" content="A production-grade Vue 3 + Node.js application template with SSO, role-based access, dynamic forms, file uploads, blog, and PWA support out of the box." />
    <meta name="robots" content="index, follow" />
    <meta name="author" content="App Template" />
    <link rel="canonical" href="/" id="canonical-link" />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="App Template" />
    <meta property="og:title" content="App Template" />
    <meta property="og:description" content="A production-grade Vue 3 + Node.js application template." />
    <meta property="og:url" content="/" />
    <meta property="og:image" content="/pwa-512x512.png" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="App Template" />
    <meta name="twitter:description" content="A production-grade Vue 3 + Node.js application template." />
    <meta name="twitter:image" content="/pwa-512x512.png" />

    <link rel="preconnect" href="https://fonts.googleapis.com" crossorigin>
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Geist:wght@300;400;500;600;700&display=swap" rel="stylesheet" crossorigin="anonymous">
  </head>
  <body class="antialiased text-slate-600 bg-white">
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
