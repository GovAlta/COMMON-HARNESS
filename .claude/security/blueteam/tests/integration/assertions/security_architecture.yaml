skill_version: "1.2.0"
last_validated: "2026-03-20"
fixture: basic_webapp
description: "Security Architecture Design & Analysis skill — identifies deployment profile, describes security architecture, and emits SA-NNN architectural gap findings"
# NOTE: Run skills/03-security-architecture.md against the basic_webapp fixture before checking.
# The basic_webapp fixture is a plain Express/TypeScript app with no explicit profile configuration.
# Expect: profile=unknown or internal (low confidence), at least one authorization_model gap, mode=describe.

assertions:

  # --- Output artifacts (STABLE) ---

  - id: SA-OUT-01
    category: STABLE
    description: "security_architecture.json created in .ai/blueteam/data/"
    type: file_exists
    path: ".ai/blueteam/data/security_architecture.json"

  - id: SA-OUT-02
    category: STABLE
    description: "security_architecture.json is valid JSON"
    type: json_valid
    path: ".ai/blueteam/data/security_architecture.json"

  - id: SA-OUT-03
    category: STABLE
    description: "security_architecture.md report created"
    type: file_exists
    path: ".ai/blueteam/reports/security_architecture.md"

  - id: SA-OUT-04
    category: STABLE
    description: "security_architecture.html report created"
    type: file_exists
    path: ".ai/blueteam/reports/security_architecture.html"

  - id: SA-OUT-05
    category: STABLE
    description: "security_requirements.json created (SR entries extracted from SA-NNN gaps)"
    type: file_exists
    path: ".ai/blueteam/data/security_requirements.json"

  - id: SA-OUT-06
    category: STABLE
    description: "security_requirements.json is valid JSON"
    type: json_valid
    path: ".ai/blueteam/data/security_requirements.json"

  # --- Schema conformance (STABLE) ---
  # These are fields directly consumed by generate_overview_html.py.
  # A missing key causes the Security Architecture tab to silently render empty.

  - id: SA-SCH-01
    category: STABLE
    description: "assessment_name field is 'security_architecture_design'"
    type: text_present
    path: ".ai/blueteam/data/security_architecture.json"
    patterns: ["security_architecture_design"]
    case_insensitive: false

  - id: SA-SCH-02
    category: STABLE
    description: "gaps array present (required for gap findings table in overview)"
    type: json_field_exists
    path: ".ai/blueteam/data/security_architecture.json"
    field: "gaps"

  - id: SA-SCH-03
    category: STABLE
    description: "profile field present (drives profile badge in overview)"
    type: json_field_exists
    path: ".ai/blueteam/data/security_architecture.json"
    field: "profile"

  - id: SA-SCH-04
    category: STABLE
    description: "mode field present"
    type: json_field_exists
    path: ".ai/blueteam/data/security_architecture.json"
    field: "mode"

  - id: SA-SCH-05
    category: STABLE
    description: "profile_confidence field present"
    type: json_field_exists
    path: ".ai/blueteam/data/security_architecture.json"
    field: "profile_confidence"

  - id: SA-SCH-06
    category: STABLE
    description: "security_requirements.json generated_by_assessments contains 'security_architecture_design'"
    type: text_present
    path: ".ai/blueteam/data/security_requirements.json"
    patterns: ["security_architecture_design"]
    case_insensitive: false

  # --- Structural checks (STRUCTURAL) ---

  - id: SA-STR-01
    category: STRUCTURAL
    description: "security_architecture.json validates required keys against schema"
    type: json_schema
    path: ".ai/blueteam/data/security_architecture.json"
    required_keys:
      - schema_version
      - last_updated
      - assessment_name
      - application_name
      - mode
      - profile
      - profile_confidence
      - gaps

  - id: SA-STR-02
    category: STRUCTURAL
    description: "auth object present with drivers array"
    type: json_field_exists
    path: ".ai/blueteam/data/security_architecture.json"
    field: "auth"

  - id: SA-STR-03
    category: STRUCTURAL
    description: "authorization object present"
    type: json_field_exists
    path: ".ai/blueteam/data/security_architecture.json"
    field: "authorization"

  - id: SA-STR-04
    category: STRUCTURAL
    description: "data_protection object present"
    type: json_field_exists
    path: ".ai/blueteam/data/security_architecture.json"
    field: "data_protection"

  - id: SA-STR-05
    category: STRUCTURAL
    description: "perimeter object present"
    type: json_field_exists
    path: ".ai/blueteam/data/security_architecture.json"
    field: "perimeter"

  - id: SA-STR-06
    category: STRUCTURAL
    description: "logging object present"
    type: json_field_exists
    path: ".ai/blueteam/data/security_architecture.json"
    field: "logging"

  - id: SA-STR-07
    category: STRUCTURAL
    description: "Report has Profile Identification section"
    type: section_present
    path: ".ai/blueteam/reports/security_architecture.md"
    pattern: "Profile"

  - id: SA-STR-08
    category: STRUCTURAL
    description: "Report has Gap Findings section (or note that no gaps found)"
    type: section_present
    path: ".ai/blueteam/reports/security_architecture.md"
    pattern: "Gap"

  - id: SA-STR-09
    category: STRUCTURAL
    description: "profile value is one of the canonical set"
    type: text_present
    path: ".ai/blueteam/data/security_architecture.json"
    patterns: ["internal", "public", "dual", "custom", "unknown"]
    case_insensitive: false

  - id: SA-STR-10
    category: STRUCTURAL
    description: "Report includes related-diagrams callout referencing the Threat Model"
    type: text_present
    path: ".ai/blueteam/reports/security_architecture.md"
    patterns: ["Threat Model", "threat model"]
    case_insensitive: true

  - id: SA-STR-11
    category: STRUCTURAL
    description: "Report includes At-a-Glance Metrics section"
    type: text_present
    path: ".ai/blueteam/reports/security_architecture.md"
    patterns: ["At-a-Glance", "Metrics"]
    case_insensitive: true

  - id: SA-STR-12
    category: STRUCTURAL
    description: "Report includes Control Coverage Matrix section"
    type: text_present
    path: ".ai/blueteam/reports/security_architecture.md"
    patterns: ["Control Coverage"]
    case_insensitive: true

  # --- Behavioral (BEHAVIORAL) ---

  - id: SA-BEH-01
    category: BEHAVIORAL
    description: "At least one gap identified (basic_webapp has incomplete authorization model)"
    type: json_count_min
    path: ".ai/blueteam/data/security_architecture.json"
    field: "gaps"
    min: 1

  - id: SA-BEH-02
    category: BEHAVIORAL
    description: "Gap IDs follow SA-NNN format"
    type: json_field_regex
    path: ".ai/blueteam/data/security_architecture.json"
    field: "gaps"
    id_field: "id"
    pattern: "^SA-\\d+"

  - id: SA-BEH-03
    category: BEHAVIORAL
    description: "mode is 'describe' (basic_webapp has code but no requirements docs)"
    type: text_present
    path: ".ai/blueteam/data/security_architecture.json"
    patterns: ["describe"]
    case_insensitive: false

  - id: SA-BEH-04
    category: BEHAVIORAL
    description: "Report references the identified profile"
    type: text_present
    path: ".ai/blueteam/reports/security_architecture.md"
    patterns: ["Profile A", "Profile B", "Profile C", "internal", "public", "dual", "unknown"]
    case_insensitive: true

  - id: SA-BEH-05
    category: BEHAVIORAL
    description: "At least 1 SR entry extracted from SA-NNN gaps"
    type: json_count_min
    path: ".ai/blueteam/data/security_requirements.json"
    field: "requirements"
    min: 1

  - id: SA-BEH-06
    category: BEHAVIORAL
    description: "Skill file documents gitignore check for .env files (not a Critical/High gap when gitignored)"
    type: text_present
    path: "../../skills/03-security-architecture.md"
    patterns: ["gitignore_covers_env", "gitignore"]
    case_insensitive: false

  - id: SA-BEH-07
    category: BEHAVIORAL
    description: "Skill file uses correct two-tier audit logging scope (writes = all Protected B; reads = PHN/SIN/health/financial only)"
    type: text_present
    path: "../../skills/03-security-architecture.md"
    patterns: ["PHN", "SIN", "two-tier"]
    case_insensitive: false
