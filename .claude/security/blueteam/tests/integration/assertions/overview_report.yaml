skill_version: "unknown"
last_validated: "2026-03-07"
fixture: basic_webapp
description: "Security Overview Report — unified SPA generated by generate_overview_html.py"
# NOTE: Requires threat_model, asvs, cas, kill_chain, dr_resilience, security_unit_test outputs pre-existing.
# NOTE: Tab count is 11 when security_unit_test has run (adds Unit Tests tab) and
#       risk_acceptances.json is absent; 12 when risk_acceptances.json is also present.
#       basic_webapp fixture includes security_unit_test output, so 11 tabs expected.

assertions:
  # --- Upstream data artifact presence (STABLE: required before overview can run) ---

  - id: OVW-OUT-01
    category: STABLE
    description: "security_overview.html created"
    type: file_exists
    path: ".ai/blueteam/reports/security_overview.html"

  - id: OVW-OUT-02
    category: STABLE
    description: "code_changes.json present in .ai/blueteam/data/ (required upstream artifact)"
    type: file_exists
    path: ".ai/blueteam/data/code_changes.json"

  - id: OVW-OUT-03
    category: STABLE
    description: "security_requirements.json present in .ai/blueteam/data/ (required upstream artifact)"
    type: file_exists
    path: ".ai/blueteam/data/security_requirements.json"

  - id: OVW-OUT-04
    category: STABLE
    description: "kill_chains.json present in .ai/blueteam/data/ (required upstream artifact from kill_chain skill)"
    type: file_exists
    path: ".ai/blueteam/data/kill_chains.json"

  - id: OVW-OUT-05
    category: STABLE
    description: "verification_tests.json present in .ai/blueteam/data/ (required upstream verification artifact)"
    type: file_exists
    path: ".ai/blueteam/data/verification_tests.json"

  # --- HTML structure (STRUCTURAL) ---

  - id: OVW-STR-01
    category: STRUCTURAL
    description: "HTML has at least 11 tab panels (11 standard when security_unit_test run + optional Risk Register)"
    type: html_tab_count
    path: ".ai/blueteam/reports/security_overview.html"
    min: 11

  - id: OVW-STR-02
    category: STRUCTURAL
    description: "Security Reqs tab panel present (panel-security-reqs)"
    type: text_present
    path: ".ai/blueteam/reports/security_overview.html"
    patterns: ["panel-security-reqs"]

  - id: OVW-STR-03
    category: STRUCTURAL
    description: "Dashboard tab present"
    type: text_present
    path: ".ai/blueteam/reports/security_overview.html"
    patterns: ["panel-dashboard", "Dashboard"]

  - id: OVW-STR-04
    category: STRUCTURAL
    description: "Remediation Plan tab present"
    type: text_present
    path: ".ai/blueteam/reports/security_overview.html"
    patterns: ["panel-remediation"]

  - id: OVW-STR-05
    category: STRUCTURAL
    description: "Attack Chains tab present"
    type: text_present
    path: ".ai/blueteam/reports/security_overview.html"
    patterns: ["panel-chains"]

  - id: OVW-STR-06
    category: STRUCTURAL
    description: "Resiliency & DR tab present"
    type: text_present
    path: ".ai/blueteam/reports/security_overview.html"
    patterns: ["panel-dr"]

  - id: OVW-STR-07
    category: STRUCTURAL
    description: "switchTab JavaScript function present (required for tab navigation)"
    type: text_present
    path: ".ai/blueteam/reports/security_overview.html"
    patterns: ["function switchTab("]

  - id: OVW-STR-08
    category: STRUCTURAL
    description: "security_overview.md created alongside HTML"
    type: file_exists
    path: ".ai/blueteam/reports/security_overview.md"

  - id: OVW-STR-09
    category: STRUCTURAL
    description: "Unit Tests tab panel present (panel-unit-tests)"
    type: text_present
    path: ".ai/blueteam/reports/security_overview.html"
    patterns: ["panel-unit-tests"]

  # --- Behavioral (BEHAVIORAL) ---

  - id: OVW-BEH-01
    category: BEHAVIORAL
    description: "Finding cards rendered (CC-NNN references present)"
    type: text_present
    path: ".ai/blueteam/reports/security_overview.html"
    patterns: ["CC-"]

  - id: OVW-BEH-02
    category: BEHAVIORAL
    description: "Kill chain cards rendered (KC-NNN references present)"
    type: text_present
    path: ".ai/blueteam/reports/security_overview.html"
    patterns: ["KC-"]

  - id: OVW-BEH-03
    category: BEHAVIORAL
    description: "Security classification card links to security-classification.html"
    type: text_present
    path: ".ai/blueteam/reports/security_overview.html"
    patterns: ["security-classification.html"]

  - id: OVW-BEH-04
    category: BEHAVIORAL
    description: "Overview includes verification status summary section"
    type: text_present
    path: ".ai/blueteam/reports/security_overview.html"
    patterns: ["Verification Coverage", "Verification Status"]

  - id: OVW-BEH-05
    category: BEHAVIORAL
    description: "Unit Test Cvg dashboard card present"
    type: text_present
    path: ".ai/blueteam/reports/security_overview.html"
    patterns: ["Unit Test Cvg"]

  - id: OVW-BEH-06
    category: BEHAVIORAL
    description: "Dashboard card links to security_unit_test_coverage.html"
    type: text_present
    path: ".ai/blueteam/reports/security_overview.html"
    patterns: ["security_unit_test_coverage.html"]

  - id: OVW-BEH-07
    category: BEHAVIORAL
    description: "Header contains 12px repo identity colour strip"
    type: text_present
    path: ".ai/blueteam/reports/security_overview.html"
    patterns: ["class=\"repo-strip\"", "height:12px"]
    case_insensitive: false

  - id: OVW-BEH-08
    category: BEHAVIORAL
    description: "App name is the H1 heading (not the report type label)"
    type: text_present
    path: ".ai/blueteam/reports/security_overview.html"
    patterns: ["<h1>", "class=\"report-type\">Security Assessment Overview"]
    case_insensitive: false

  - id: OVW-BEH-09
    category: BEHAVIORAL
    description: "Repo badge and branch/SHA present in header meta"
    type: text_present
    path: ".ai/blueteam/reports/security_overview.html"
    patterns: ["class=\"repo-badge\"", "&middot;"]
    case_insensitive: false

  - id: OVW-BEH-10
    category: BEHAVIORAL
    description: "ASVS Level 2 verdict card present on Dashboard with href link to panel-asvs"
    type: text_present
    path: ".ai/blueteam/reports/security_overview.html"
    patterns: ["ASVS Level 2", "href=\"#panel-asvs\""]

  - id: OVW-BEH-11
    category: BEHAVIORAL
    description: "CAS verdict card present on Dashboard with href link to panel-cas"
    type: text_present
    path: ".ai/blueteam/reports/security_overview.html"
    patterns: ["CAS", "href=\"#panel-cas\""]
