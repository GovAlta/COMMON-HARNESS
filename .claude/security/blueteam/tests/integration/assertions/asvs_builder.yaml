skill_version: "1.0.0"
last_validated: "2026-03-09"
fixture: basic_webapp
description: >
  ASVS-Compliant Builder skill — code generation skill.
  Builder skills do not produce .ai/ data artifacts; they generate source code
  into the target repository. Testing strategy: STABLE assertions verify the
  skill file exists and is well-formed. Functional correctness is verified by
  manual invocation and code review against the basic_webapp fixture.

